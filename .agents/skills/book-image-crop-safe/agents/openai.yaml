  default_prompt: "Dùng $book-image-crop-safe để đặt tên và tối ưu ảnh của một bookId; chỉ dùng tập ảnh được cung cấp, giảm dung lượng bằng resize/nén nhẹ khi có lợi, giữ chất lượng/bố cục, không tự tải thêm ảnh hoặc tạo clone/biến thể."
